<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Gothik';
            src: url(fonts/Gothik\ Steel.ttf) format(truetype);
            font-weight: normal;
            font-style: normal;

            /*Tipos de formatos()
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            -svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Gothik', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Títulos</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsum officiis quo consectetur cupiditate ex eius esse, labore aut perferendis, voluptates repudiandae inventore illum blanditiis, fuga obcaecati eum quisquam assumenda ea!</p>
</body>
</html>
