<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 { /*box-level*/
            background-color: aquamarine;
            height: 300px;
            width: 300px;
            /*border-width: 10px;
            border-style: solid;
            border-color: burlywood;*/
            border: 10px solid burlywood;

            /*padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;*/

            padding: 10px;
            
            /*margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;*/

            margin: 20px 20px 40px 10px;
            
            outline-width: 5px;
            outline-style: dashed;
            outline-color: blueviolet;

        }

        a{  /*inline-level*/
            border-width: 10px;
            border-style: solid;
            border-color: brown;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box level</h1>
    <p>Paragrafos também são exemplos de box-level, mas <a href="#">links são exemplos de ciaxas inline-level</a>. Vamos ver como tudo funciona.</p>
</body>
</html>
